  <rect x="40" y="280" width="400" height="150" fill="#fff" stroke="#0e1f4a" stroke-width="2"/>
  <rect x="40" y="280" width="8" height="150" fill="#efb700"/>
  <text x="64" y="316" font-family="system-ui,sans-serif" font-size="11" fill="#0e1f4a" letter-spacing="1">CURRENT PROTOTYPE</text>
  <text x="64" y="348" font-family="Georgia, serif" font-size="22" fill="#0e0f11">Ozzy · Birmingham</text>
  <text x="64" y="376" font-family="system-ui,sans-serif" font-size="13" fill="#5c5a54">Voice, brand, 69 wards, Next.js app,</text>
  <text x="64" y="396" font-family="system-ui,sans-serif" font-size="13" fill="#5c5a54">City Observatory / DWP / WMP wiring</text>

  <!-- Other places -->
  <rect x="460" y="280" width="400" height="150" fill="#fff" stroke="#0e1f4a" stroke-width="2"/>
  <rect x="460" y="280" width="8" height="150" fill="#1c3f94"/>
  <text x="484" y="316" font-family="system-ui,sans-serif" font-size="11" fill="#0e1f4a" letter-spacing="1">PLANNED LOCAL ADAPTATION</text>
  <text x="484" y="348" font-family="Georgia, serif" font-size="22" fill="#0e0f11">Your council · your place</text>
  <text x="484" y="376" font-family="system-ui,sans-serif" font-size="13" fill="#5c5a54">Same skills · your open data · your wards</text>
  <text x="484" y="396" font-family="system-ui,sans-serif" font-size="13" fill="#5c5a54">Your brand · your briefings</text>

  <text x="40" y="480" font-family="system-ui,sans-serif" font-size="12" fill="#5c5a54">Explore the data. See patterns. Ask why they matter. Check the evidence.</text>
